# SangamIO configuration for the Xiaomi Mi Robot Vacuum-Mop Pro (viomi.vacuum.v8)
#
# Hardware: 3irobotix CRL-200S platform, Allwinner R16, GD32F103 MCU on ttyS3,
# 3irobotix LDS3 (Delta-2D class) lidar on ttyS1. Protocol reference:
# ../../docs/HW_PROTOCOLS.md in the parent project.
#
# Run from RAM only:   /tmp/sangamio /tmp/viomi_v8.toml
# Never install to /usr/sbin and never rename AuxCtrl on this unit.

[device]
type = "crl200s"
name = "viomi v8 (CRL-200S)"

[device.hardware]
gd32_port = "/dev/ttyS3"
lidar_port = "/dev/ttyS1"

# 20 ms = 50 Hz, the rate the vendor AuxCtrl sends 0x66 (measured docked).
heartbeat_interval_ms = 20

# Regime PWM after the 100% spin-up, used until the speed loop has samples.
# A FIXED 73 (forks' value) spun this unit to 8 rev/s, outside the LDS3's measuring
# window (only 0xAE "error speed" packets). 60 measured fine at 5.2 rev/s.
# 100% for >30 s causes a lidar thermal stop.
lidar_pwm = 60

# Closed-loop speed like the vendor (AuxCtrl lidarSpeedControl, target 6.0 rev/s).
lidar_speed_target_rps = 6.0

# Lidar rail-off settle before rail-on (oangelo issue #14). 10 s is the value that
# recovered cold starts on their unit. Lower it to iterate faster once proven.
lidar_rail_off_settle_ms = 10000

# Dead-man: the GD32 holds the last velocity forever. Short window for first tests.
deadman_timeout_ms = 500

# UNCALIBRATED for v8. Vendor decompile (CRobotParams) says 16561 units per m/s and
# 2000 per rad/s; oangelo tape-measured 4483 per m/s on a CRL-200S running stock
# firmware. Lower is safer (slower than requested), so start from 4483 and calibrate
# on blocks (HANDOVER T4).
linear_velocity_scale = 4483.0
angular_velocity_scale = 523.0

# Odometry constants published in the kinematics group. UNCALIBRATED for v8:
# vendor decompile 0.0604 mm/tick, track 0.2415 m; oangelo 0.2214 mm/tick, track 0.238.
wheel_mm_per_tick = 0.2214
wheel_track_m = 0.238

# Stop all motors, actuators and the lidar at start (the MCU keeps old state).
safe_start = true

[device.hardware.lidar_mounting]
# CRL-200S reference geometry (Proscenic M6 Pro); verify on v8 in T5.
offset_x = -0.110
offset_y = 0.0
optical_offset = 0.025
angle_offset = 0.2182

[device.hardware.frame_transforms]

# CRL-200S lidar spins CW and is mounted backward.
[device.hardware.frame_transforms.lidar]
scale = -1.0
offset = 3.14159265

# Gyro remap to ROS (x roll, y pitch, z yaw). Yaw sign UNVERIFIED on v8
# (Proscenic +1, oangelo's unit -1): check with a 90 deg CCW turn in T5.
[device.hardware.frame_transforms.imu_gyro]
x = [2, 1]
y = [1, 1]
z = [0, 1]

[network]
bind_address = "0.0.0.0:5555"
# UDP telemetry goes to <client ip>:5556. Same port as TCP (the default) collides on
# the robot itself: SangamIO's own UDP socket and an on-robot client (DhruvaSLAM) both
# bind 5555 and Linux delivers each datagram to only one of them. Remote clients that
# use TCP telemetry (sangam_client.py, vacuum_ros2_bridge) are unaffected.
udp_client_port = 5556
