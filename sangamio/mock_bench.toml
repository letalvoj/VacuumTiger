# The SangamIO mock as close to the viomi v8 as measured, for benches: whatever runs on the
# robot with viomi_v8.toml + dhruva-v8.toml runs on this with dhruva-v8.toml unchanged.
# Measured on the v8's recordings (docs/SLAM_LAB.md, docs/HW_PROTOCOLS.md): the drive
# response, the lidar's rate, sweep and noise, odometry, the gyro's scale and deadband.
# It models the robot, not what dhruva-slam assumes of it: where they differ (the gyro
# scale), the bench shows it as the robot would.

[device]
type = "mock"
name = "Mock viomi v8"

[device.simulation]
# Map file (YAML file that references PGM image)
# Using large_room_obstacles for testing exploration with obstacles
map_file = "maps/large_room_obstacles.yaml"

# Initial robot pose (5m x 5m room - map is 100x100 at 0.05m/pixel)
start_x = 1.0    # bench: bottom-left free area
start_y = 1.0
start_theta = 0.0  # radians (0 = facing +X)

# Simulation parameters
speed_factor = 1.0    # 1.0 = real-time, 2.0 = 2x speed
random_seed = 42      # bench: deterministic
log_level = "standard"  # "minimal", "standard", "verbose"

[device.simulation.robot]
wheel_base = 0.238         # dhruva-v8.toml
ticks_per_meter = 4516.7   # dhruva-v8.toml (calibrated on flat1)
max_linear_speed = 0.3
max_angular_speed = 1.0
robot_radius = 0.175       # 35 cm body
collision_mode = "stop"
slide_friction = 0.3
# Drive steps on the v8: nothing for 80 ms, then a 120 ms lag to 90% of the command.
response_delay = 0.08
response_time_constant = 0.12
response_gain = 0.9

# Published as SangamIO's CRL-200S driver publishes with viomi_v8.toml: angles in the robot
# heading, clockwise from its lidar_mounting.angle_offset, ranges from the optical centre.
[device.simulation.lidar]
num_rays = 360             # one return per degree
scan_rate_hz = 6.03        # 166 ms per revolution
sweep_start_angle = 0.2182
mounting_x = -0.110
mounting_y = 0.0
optical_offset = 0.025
min_range = 0.15
max_range = 8.0

[device.simulation.lidar.noise]
range_stddev = 0.0005      # walls seen still: 0.5 mm + 3 mm per m
range_stddev_per_m = 0.003
range_bias = 0.0
angle_stddev = 0.0
quality_base = 200
quality_distance_decay = 10
miss_rate = 0.05           # beams with no return on plain walls

[device.simulation.imu]
gyro_scale = 5729.6        # 0.0100 deg/s per LSB, measured (dhruva-slam assumes 0.01025)

[device.simulation.imu.gyro_noise]
stddev = [5.0, 5.0, 10.0]   # raw; not measured (hidden by the deadband at rest)
bias = [0.0, 0.0, 0.0]      # none to subtract (docs/SLAM_LAB.md)
drift_rate = 0.0            # Bias drift rate (units/second)
deadband = 100.0            # |raw| < 100 (about 1 deg/s) reads 0, in the MCU

[device.simulation.imu.accel_noise]
stddev = [10.0, 10.0, 20.0]  # Noise standard deviation [x, y, z] (raw units)
bias = [0.0, 0.0, 0.0]       # Constant bias [x, y, z]

[device.simulation.imu.tilt_noise]
stddev = [5.0, 5.0, 5.0]     # Noise standard deviation [x, y, z] (raw units)
bias = [0.0, 0.0, 0.0]       # Constant bias [x, y, z]

# Encoder configuration
[device.simulation.encoder.noise]
slip_stddev = 0.02        # bench: wheel slip
slip_bias = 0.0          # Systematic slip bias
quantization_noise = true

# Bumper configuration
[device.simulation.bumpers]
trigger_distance = 0.01  # Distance from robot edge to trigger (meters)

# The shell covers the front, ±97°; head-on presses both.
[device.simulation.bumpers.left]
start_angle = -0.3       # radians, CCW from forward
end_angle = 1.7

[device.simulation.bumpers.right]
start_angle = -1.7
end_angle = 0.3

# Cliff sensor configuration
[device.simulation.cliffs]
enabled = true

[[device.simulation.cliffs.sensors]]
name = "left_side"
x = 0.12                 # X position from robot center (meters)
y = 0.10                 # Y position from robot center (meters)

[[device.simulation.cliffs.sensors]]
name = "left_front"
x = 0.15
y = 0.05

[[device.simulation.cliffs.sensors]]
name = "right_front"
x = 0.15
y = -0.05

[[device.simulation.cliffs.sensors]]
name = "right_side"
x = 0.12
y = -0.10

# Binary sensors (fixed states)
[device.simulation.sensors]
dustbox_attached = true
dock_connected = false
start_button = 0
dock_button = 0

[device.simulation.sensors.battery]
voltage = 14.8           # Battery voltage (volts)
level = 85               # Battery level (0-100%)
is_charging = false

# Actuator configuration
[device.simulation.actuators]
log_state_changes = true

# Network configuration
# TCP and UDP on same port (5555) - unified architecture
[network]
bind_address = "127.0.0.1:5555"
udp_client_port = 5555
