# dhruva-slam on the viomi v8: RAM-only paths (/tmp/v8/dhruva), never flash.
# Deriva do dhruva-live.toml (01/10/2026) com:
#   - sangam_address local (127.0.0.1) — o daemon sangam-io roda nesta mesma máquina
#   - map_storage + session em /tmp/v8/dhruva (o robô nao tem /home/oangelo)
#   - exploration e navigation DESLIGADOS: o dhruva SO streama pose/obstaculo;
#     quem dirige o drive é o close-loop.py (malha fechada).
# O GD32 NAO tem watchdog (medido 01/10: andou 1,03m apos kill -9). O dead-man do
# sangam-io (default 3000ms) e a rede de seguranca: se o close-loop morrer com o TCP
# aberto, o robô para em ~3s.

[source]
sangam_address = "127.0.0.1:5555"
# Must match SangamIO's [network] udp_client_port (viomi_v8.toml): receiving on 5555
# next to SangamIO's own UDP socket loses the datagrams.
udp_port = 5556

[output]
bind_port = 5557
odometry_rate_hz = 50
map_rate_hz = 5.0
feature_rate_hz = 1.0

[stream]
robot_status_hz = 10.0
sensor_status_hz = 10.0
map_hz = 2.0
navigation_hz = 5.0

[map_storage]
path = "/tmp/v8/dhruva/maps"

[odometry]
# Heading from the gyro while moving, distance from the wheels: the gyro heading
# drifts about half as much as the wheels' (docs/SLAM_LAB.md). Its bias needs no
# calibration here: scan matching corrects it every sweep.
algorithm = "complementary"
gyro_weight = 1.0
ticks_per_meter = 4516.7
wheel_base = 0.238

[lidar]
# SangamIO (kaiaai delta2d) already rotates points by its lidar_mounting.angle_offset;
# only the position offsets are left to the consumer. Values are CRL-200S reference
# geometry, UNVERIFIED on the v8 (HANDOVER T5).
mounting_x = -0.110
mounting_y = 0.0
optical_offset = 0.025
angle_offset = 0.0
# Deskew: the sweep starts at SangamIO's lidar_mounting.angle_offset (viomi_v8.toml).
# A 0.17 s sweep while turning at 60 deg/s spans 10 deg; deskewed, scans taken while
# turning are as crisp as still ones (golden eval wall@5cm mean 0.858 -> 0.896).
sweep_start_angle = 0.2182

[preprocessing]
min_range = 0.15
max_range = 5.0
target_points = 180
min_angle_step = 0.0175

[slam]
min_match_score = 0.3
lost_threshold = 0.1
min_scan_points = 50
encoder_weight = 0.8
use_submap_matching = false
max_theta_deviation = 0.35
max_translation_deviation = 0.5
# Reference-scan matching (0 = scan-to-scan, which drifts with p2l): see docs/SLAM_BENCH.md.
# Not used while local-map matching is on.
reference_update_distance = 0.2
reference_update_angle = 0.3
# Local-map matching: each scan against the last 20 keyframes (one per 0.2 m or
# 0.2 rad, [keyframe]). Measured on the first real floor run and the mock benches:
# docs/SLAM_LAB.md in the parent project.
local_map_keyframes = 20
local_map_max_distance = 8.0

[matcher]
# Correlative search (Gaussian-smeared grid) against the local map, refined by p2l.
# Golden eval (tools/py/golden_eval.py, flat1): wall@5cm mean 0.876 / worst 0.816, every
# window at least as good as slam_toolbox (p2l alone: 0.826 / 0.767, and fragile:
# small parameter changes swung it 0.60-0.83). Mock benches 0.38/0.36 cm, 3.7 ms/scan
# on a Mac. History: docs/SLAM_LAB.md, docs/SLAM_BENCH.md.
# The +-0.2 windows were tuned on that one recording: a jump larger than 0.2 m / 11 deg
# between scans is not recovered here (loop closure searches wider). The other configs
# keep the wider 0.3 / 0.5 windows.
algorithm = "hybrid_p2l"
always_correlative = true
encoder_weight = 1.0
search_window_x = 0.2
search_window_y = 0.2
search_window_theta = 0.2
linear_resolution = 0.02
angular_resolution = 0.01
grid_resolution = 0.05
correlative_min_score = 0.4
icp_max_iterations = 50
icp_translation_epsilon = 0.001
icp_rotation_epsilon = 0.001
icp_max_correspondence_distance = 0.5
icp_min_correspondences = 10
icp_outlier_ratio = 0.1
icp_robust_kernel = "welsch"
icp_kernel_scale = 0.1
# multi_res coarse search window around the odometry guess. 0.2 m / 0.2 rad: same
# ATE as 0.5 on the mock benches, 16 ms/scan on the R16 instead of 84 (0.15 -> 11 ms;
# kept some margin for real-floor wheel slip the mock does not model).
multires_window_xy = 0.2
multires_window_theta = 0.2
multires_levels = 3

[keyframe]
# Dense keyframes: they are the local map (see [slam] local_map_keyframes).
min_translation = 0.2
min_rotation = 0.2
max_keyframes = 1000
min_interval_ms = 0

[submap]
scans_per_submap = 100
overlap_scans = 10
max_active_submaps = 2

[map]
# 5 cm: same ATE as 2 cm on the mock bench, 4x cheaper on the R16 (docs/SLAM_BENCH.md)
resolution = 0.05
initial_width = 20.0
initial_height = 20.0
log_odds_occupied = 0.9
log_odds_free = -0.7
log_odds_max = 50.0
log_odds_min = -50.0
occupied_threshold = 0.5
free_threshold = -0.5

[loop_closure]
# Proximity closures: every detection_interval-th keyframe is matched (wide
# correlative search, then the fine matcher) against old keyframes near it.
# See src/engine/graph/loop_detector.rs.
# Golden eval (captures/golden/flat1, tools/py/golden_eval.py): wall@5cm mean 0.691 -> 0.825,
# worst 0.424 -> 0.767 over 14 windows; the full run 0.813 vs slam_toolbox 0.819.
enabled = true
detection_interval = 5
min_keyframe_gap = 30
search_radius = 1.5
area_keyframes = 10
search_window_xy = 0.5
search_window_theta = 0.35
min_score = 0.6
std_xy = 0.03
std_theta = 0.015

[optimization]
solver = "sparse_cg"
max_iterations = 50
tolerance = 1e-6

[exploration]
# Off: enabling it lets start_mapping drive the robot. The household's
# `scripts/robot/run_web.sh 0 <tag> sweep` (outside this repo) turns it on in a
# RAM copy of this file.
enabled = false
# The corner sweep: follow the walls around the room once, touching them every ~2.5 m.
strategy = "wall_follow"
loop_rate_hz = 10.0
# Not leaving a 1 m circle for this long (s) ends the sweep with "Stuck: ...".
stuck_after_s = 180.0

# The rest (speed, turn rate, lap, `tuning`) are the code's defaults, hill-climbed on the
# lab's sweep bench (`dhruva-lab/src/bin/sweep`).
[exploration.wall_follow]
side = "right"

[exploration.motion]
max_linear_vel = 0.4
# The stock firmware spins at 1.4 rad/s; wall_follow caps itself lower (`turn_rate`). This
# also caps frontier and its MoveTo.
max_angular_vel = 1.4
obstacle_clearance = 0.15
linear_vel = 0.3
angular_vel = 0.5

[exploration.frontier]
min_frontier_size = 3
detection_range = 10.0
blocked_radius = 0.15
clustering_threshold = 0.5

[navigation]
enabled = false
update_rate_hz = 10.0
robot_radius = 0.18
safety_margin = 0.10
max_linear_vel = 0.4
max_angular_vel = 0.8
waypoint_threshold = 0.15
heading_threshold = 0.35
unknown_is_obstacle = false

[session]
state_path = "/tmp/v8/dhruva/session.json"
auto_load_last_map = false
