# dhruva-slam on the viomi v8: RAM-only paths (/tmp/v8/dhruva), never flash.
# Deriva do dhruva-live.toml (01/10/2026) com:
#   - sangam_address local (127.0.0.1) — o daemon sangam-io roda nesta mesma máquina
#   - map_storage + session em /tmp/v8/dhruva (o robô nao tem /home/oangelo)
#   - exploration e navigation DESLIGADOS: o dhruva SO streama pose/obstaculo;
#     quem dirige o drive é o close-loop.py (malha fechada).
# O GD32 NAO tem watchdog (medido 01/10: andou 1,03m apos kill -9). O dead-man do
# sangam-io (default 3000ms) e a rede de seguranca: se o close-loop morrer com o TCP
# aberto, o robô para em ~3s.

[source]
sangam_address = "127.0.0.1:5555"
# Must match SangamIO's [network] udp_client_port (viomi_v8.toml): receiving on 5555
# next to SangamIO's own UDP socket loses the datagrams.
udp_port = 5556

[output]
bind_port = 5557
odometry_rate_hz = 50
map_rate_hz = 5.0
feature_rate_hz = 1.0

[stream]
robot_status_hz = 10.0
sensor_status_hz = 10.0
map_hz = 2.0
navigation_hz = 5.0

[map_storage]
path = "/tmp/v8/dhruva/maps"

[odometry]
algorithm = "wheel"
ticks_per_meter = 4516.7
wheel_base = 0.238

[lidar]
# SangamIO (kaiaai delta2d) already rotates points by its lidar_mounting.angle_offset;
# only the position offsets are left to the consumer. Values are CRL-200S reference
# geometry, UNVERIFIED on the v8 (HANDOVER T5).
mounting_x = -0.110
mounting_y = 0.0
optical_offset = 0.025
angle_offset = 0.0

[preprocessing]
min_range = 0.15
max_range = 5.0
target_points = 180
min_angle_step = 0.0175

[slam]
min_match_score = 0.3
lost_threshold = 0.1
min_scan_points = 50
encoder_weight = 0.8
use_submap_matching = false
max_theta_deviation = 0.35
max_translation_deviation = 0.5
# Reference-scan matching (0 = scan-to-scan, which drifts with p2l): see docs/SLAM_BENCH.md
reference_update_distance = 0.2
reference_update_angle = 0.3

[matcher]
# p2l against a reference scan ([slam] reference_update_distance = 0.2): ATE 1.1/1.6 cm
# on the mock benches (slam_toolbox: 0.8/3.5 cm), 3 mm drift on a real static v8
# recording, 5.9 ms/scan on the R16 (stock config: 589 ms). See docs/SLAM_BENCH.md.
# Fallback if something looks off on real floors: multi_res (16 ms, 4-17 cm).
algorithm = "p2l"
always_correlative = true
encoder_weight = 1.0
search_window_x = 0.3
search_window_y = 0.3
search_window_theta = 0.5
linear_resolution = 0.02
angular_resolution = 0.01
grid_resolution = 0.05
correlative_min_score = 0.4
icp_max_iterations = 50
icp_translation_epsilon = 0.001
icp_rotation_epsilon = 0.001
icp_max_correspondence_distance = 0.5
icp_min_correspondences = 10
icp_outlier_ratio = 0.1
icp_robust_kernel = "welsch"
icp_kernel_scale = 0.1
# multi_res coarse search window around the odometry guess. 0.2 m / 0.2 rad: same
# ATE as 0.5 on the mock benches, 16 ms/scan on the R16 instead of 84 (0.15 -> 11 ms;
# kept some margin for real-floor wheel slip the mock does not model).
multires_window_xy = 0.2
multires_window_theta = 0.2
multires_levels = 3

[keyframe]
min_translation = 0.5
min_rotation = 0.5
max_keyframes = 1000
min_interval_ms = 500

[submap]
scans_per_submap = 100
overlap_scans = 10
max_active_submaps = 2

[map]
# 5 cm: same ATE as 2 cm on the mock bench, 4x cheaper on the R16 (docs/SLAM_BENCH.md)
resolution = 0.05
initial_width = 20.0
initial_height = 20.0
log_odds_occupied = 0.9
log_odds_free = -0.7
log_odds_max = 50.0
log_odds_min = -50.0
occupied_threshold = 0.5
free_threshold = -0.5

[loop_closure]
# Off for the first PoC. The false closures seen on the mock bench came from a
# lidar-frame mismatch (fixed), not from loop closure; re-evaluate on a real
# multi-room recording before enabling (docs/SLAM_BENCH.md).
enabled = false
detection_interval = 5
min_keyframe_gap = 20
optimization_threshold = 3
max_candidates = 5

[loop_closure.iris]
num_rows = 80
num_cols = 360
max_range = 6.0
signature_bits = 640

[loop_closure.matching]
max_hamming_distance = 100
min_icp_score = 0.5

[optimization]
solver = "sparse_cg"
max_iterations = 50
tolerance = 1e-6

[exploration]
enabled = false
strategy = "frontier"
loop_rate_hz = 10.0

[exploration.motion]
max_linear_vel = 0.4
max_angular_vel = 0.8
obstacle_clearance = 0.15
linear_vel = 0.3
angular_vel = 0.5

[exploration.frontier]
min_frontier_size = 3
detection_range = 10.0
blocked_radius = 0.15
clustering_threshold = 0.5

[navigation]
enabled = false
update_rate_hz = 10.0
robot_radius = 0.18
safety_margin = 0.10
max_linear_vel = 0.4
max_angular_vel = 0.8
waypoint_threshold = 0.15
heading_threshold = 0.35
unknown_is_obstacle = false

[session]
state_path = "/tmp/v8/dhruva/session.json"
auto_load_last_map = false